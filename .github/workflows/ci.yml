name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Formatting gets its own job on purpose. Sharing a job with clippy and the
  # tests means one rustfmt diff aborts the job before anything is compiled, so
  # every platform fails identically and the real errors stay hidden.
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - uses: Swatinem/rust-cache@v2

      # minifb links against the platform window system, which the runner image
      # does not ship by default.
      - name: Install Linux window-system headers
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libxkbcommon-dev libx11-dev libxcb1-dev libxcb-randr0-dev \
            libxcb-shape0-dev libxcb-xfixes0-dev libwayland-dev

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build
        run: cargo build --workspace --release

      - name: Test
        run: cargo test --workspace --release

  blargg:
    name: Blargg test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Fetch the test ROM suite
        run: bash scripts/fetch-test-roms.sh

      - name: Run the suite
        env:
          # A missing ROM must fail the job rather than skip silently.
          GB_REQUIRE_TEST_ROMS: "1"
        run: cargo test --release -p gb-core --test blargg -- --nocapture

  wasm:
    name: wasm build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Requested here rather than in rust-toolchain.toml, so the host-only jobs
      # do not each download the wasm target.
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2

      - name: Build for the browser target
        run: cargo build -p gb-wasm --target wasm32-unknown-unknown --release

      - name: Ensure the artifact exists
        run: test -f target/wasm32-unknown-unknown/release/gb_wasm.wasm

  docs:
    name: rustdoc
    runs-on: ubuntu-latest
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build documentation
        run: cargo doc --workspace --no-deps
